name: tests

# Runs the fixture-based test suite (tests/) and `ruff check .` on every
# push/PR. Deliberately lightweight: no real UM NetCDF data, no conda env -
# a plain `pip install` of iris/aeolus/etc. resolves cleanly via prebuilt
# wheels, so a standard actions/setup-python job is enough.
#
# `.[dev,viz]`, not just `.[dev]` - tests/test_viz.py needs matplotlib
# (the `viz` extra); it skips itself via pytest.importorskip() if that
# extra isn't installed, but CI should actually run it, not silently
# skip it forever.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .[dev,viz]
      - run: ruff check .
      - run: pytest
